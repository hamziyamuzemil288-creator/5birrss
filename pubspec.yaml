name: birr5
description: Aliob — location-based multi-sector marketplace and service platform.
publish_to: 'none'
version: 1.9.3+130
environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  http: ^1.2.0
  flutter:
    sdk: flutter
  # The one dependency `flutter create` adds that this manifest had dropped.
  # Material reaches for Cupertino's glyphs on iOS-style widgets, so the
  # release build's icon tree-shaker finds the family referenced and no font
  # to draw it, and says so on every release build:
  #   Expected to find fonts for (MaterialIcons,
  #   packages/cupertino_icons/CupertinoIcons), but found (MaterialIcons)
  # Font and IconData constants only: no code, no plugin, no native side.
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.6
  # Direct, not transitive: the staff workspace subscribes to postgres_changes
  # so the task feed updates the moment work arrives, and naming the
  # RealtimeChannel type requires importing it. Already resolved at 2.13.0
  # through supabase_flutter, so this pins nothing new.
  realtime_client: ^2.13.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  geocoding: ^4.0.0
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  image_picker: ^1.0.7
  share_plus: ^13.2.0
  path_provider: ^2.1.0
  url_launcher: ^6.3.2
  # Session tokens are persisted here, not in SharedPreferences: the access
  # and refresh tokens live in the Android Keystore / iOS Keychain. See
  # core/services/secure_session_storage.dart.
  flutter_secure_storage: ^11.2.0
  # Push notifications (FCM transport only). Firebase is configured with
  # explicit FirebaseOptions from --dart-define (see core/config/env.dart), so
  # there is NO google-services.json and NO google-services Gradle plugin — a
  # build without the Firebase dart-defines still succeeds, push just stays
  # off. See core/services/notification_service.dart.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Used only to create the Android notification channel and to display a
  # foreground push as a system notification (background/killed pushes are
  # shown by the OS without this). See notification_service.dart.
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

  supabase: any
  geolocator_platform_interface: any
  plugin_platform_interface: any
flutter:
  uses-material-design: true
  assets:
    - assets/images/aliob_logo_mark.png
