name: Build Release AAB

# Dispatch-only (Task 9): the Play-ready AAB must never build as a side
# effect of pushing code. Run it explicitly from the Actions tab when a
# release build is actually wanted.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Needed only by the quota-fallback step that attaches the AAB to a
    # GitHub Release; every other step is read-only.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        # cache/pub-cache are OFF by default in flutter-action v2: without them
        # every run re-downloads the Flutter SDK and every pub package. See the
        # same note in flutter-ci.yml — Actions minutes are metered.
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Flutter info
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      # Keystore lives in Actions secrets (KEYSTORE_BASE64), never in the repo.
      # See docs/SIGNING.md. PKCS12: the key password equals the store password.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::One or more signing secrets are missing/empty. Required: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS (see docs/SIGNING.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-keystore.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release-keystore.p12" >> "$GITHUB_ENV"

      - name: Build release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build appbundle \
            --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} \
            --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Upload AAB artifact
        # continue-on-error: when Actions artifact storage is over quota (the
        # meter lags cleanup by 6-12 h), the upload fails but the fallback
        # step below still delivers the AAB via a Release asset and the run
        # stays green — the build itself succeeded.
        id: upload-aab
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Attach AAB to a GitHub Release (quota fallback)
        # Release assets are NOT part of the Actions artifact-storage quota,
        # so this lands the AAB even while the quota meter is still lagging.
        if: steps.upload-aab.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="release-build-$(date -u +%Y%m%d)"
          VERSION="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          COMMIT="${GITHUB_SHA::7}"
          NAME="5birr-release-${VERSION}-${COMMIT}.aab"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          REPO="${{ github.repository }}"

          NOTES="Automated release AAB from commit ${COMMIT} (built $(date -u '+%Y-%m-%d %H:%M UTC')). Attached here because Actions artifact storage was over quota. This is the release-signed bundle for Play Console."

          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$REPO" "$AAB#$NAME" --clobber
            echo "AAB attached to existing release $TAG as $NAME"
          else
            gh release create "$TAG" -R "$REPO" \
              --target "$GITHUB_SHA" \
              --title "Release build ${VERSION} (${TAG})" \
              --notes "$NOTES" \
              "$AAB#$NAME"
            echo "AAB attached to new release $TAG as $NAME"
          fi

          echo "::notice::AAB available at https://github.com/${REPO}/releases/tag/${TAG} (asset: ${NAME})"
