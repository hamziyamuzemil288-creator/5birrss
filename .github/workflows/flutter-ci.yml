# 5BIRR Flutter CI Pipeline — debug + release builds
name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  flutter-pub-get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reclaim the runner's disk before anything else is downloaded onto it.
      #
      # Run 37900731154 died here, and nothing in the app was wrong:
      #
      #   ERROR: build/app/outputs/mapping/release/seeds.txt: R8:
      #          java.io.IOException: No space left on device
      #   Execution failed for task ':app:mergeReleaseNativeLibs'
      #   > A failure occurred while executing ...MergeNativeLibsTask
      #   > No space left on device
      #
      # A hosted runner leaves ~14 GB free on /, and this job is the one job
      # that spends it twice: it builds a debug APK and then a release
      # appbundle, two full Gradle builds of the same project, where the
      # dedicated Build Release AAB / Build Debug APK workflows each pay for
      # only one (those pass, in ~10 min, on a fresh runner). The release
      # build runs last, so it is the one that pays the shortfall — and R8 is
      # the hungriest step in it, which is why the failure lands there.
      #
      # The image ships toolchains a Flutter Android build never reaches: the
      # .NET SDK, the Haskell toolchain (ghcup), Swift, CodeQL's bundle, Boost,
      # and the Android emulator with its system images. That is the cheapest
      # space on the runner to give up. `du` reports each one before it is
      # removed, so the log carries measured numbers instead of assumptions
      # about what this image happens to ship this month.
      #
      # The Android SDK and its NDK are deliberately NOT in the list. The
      # release build names the NDK through `ndkVersion = flutter.ndkVersion`
      # (android/app/build.gradle.kts), and AGP answers a missing NDK by
      # downloading that exact version mid-build — ~660 MB compressed, 2-3 GB
      # extracted. Freeing space by forcing a download is not freeing space.
      # NOTE (minutes pass): this job no longer builds twice — the debug APK
      # build is temporarily removed below — so the shortfall this reclaim was
      # added for no longer applies. It is kept anyway: it costs ~30 s and the
      # R8 out-of-space failure it prevents costs an entire run.
      - name: Reclaim runner disk space
        run: |
          echo "::group::disk before reclaim"
          df -h /
          echo "::endgroup::"
          for d in \
            /usr/share/dotnet \
            /usr/local/.ghcup \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/emulator
          do
            if [ -e "$d" ]; then
              sudo du -sh "$d" || true
              sudo rm -rf "$d"
            else
              echo "not present on this image: $d"
            fi
          done
          # Package lists and downloaded .deb files the image will never need.
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          echo "::group::disk after reclaim"
          df -h /
          echo "::endgroup::"

      # `cache` and `pub-cache` are NOT on by default in flutter-action v2, and
      # this workflow never switched them on: every run re-downloaded the
      # Flutter SDK (~1 GB, several minutes) and every pub package from
      # pub.dev, then threw them away. That is the largest recurring cost here,
      # and GitHub-hosted minutes are metered — they were above 90% when this
      # was found.
      #
      # `channel: stable` does not defeat the cache: the action resolves the
      # channel to a concrete version and keys the cache on that, so runs on
      # the same stable release reuse it and a new stable release misses once.
      # Pinning an exact version would cache even harder, but this workflow has
      # never pinned and changing that here would also change which SDK ships.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Scaffold missing platform directories
        run: flutter create --platforms=android,ios .

      - name: Commit platform scaffolding if generated
        # Only on main pushes: PR checkouts sit on a merge ref that cannot
        # accept a push.
        if: github.event_name == 'push'
        run: |
          if [ -z "$(git status --porcelain android/ ios/)" ]; then
            echo "No new platform files — skipping commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/ ios/
            git commit -m "chore: scaffold missing android/ios platform directories via flutter create"
            # Rebase onto whatever landed while this job was running. Without
            # this a push that lands during the build makes every later
            # scaffold commit fail with "rejected: fetch first", and the
            # non-fast-forward took the whole build down with it — including
            # the analyze/test/apk steps that had not run yet.
            #
            # Scaffolding is disposable: it is regenerated by the step above
            # on every run, so failing to persist it is not worth failing a
            # release build over. Warn and carry on rather than erroring.
            if ! git pull --rebase origin main; then
              echo "::warning::could not rebase generated platform scaffolding; skipping commit"
              exit 0
            fi
            git push || echo "::warning::could not push generated platform scaffolding; it will be regenerated next run"
          fi

      - name: Inject Supabase env vars
        run: |
          cat > .env <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      # Analyzer ERRORS block the build; infos and warnings do not.
      #
      # This step used to be `continue-on-error: true`, which meant it
      # reported 6 undefined-method errors in auth_provider.dart and CI
      # carried on — the failure only surfaced 3 minutes later in the APK
      # build, with the analyzer output buried in a non-blocking step. Every
      # real defect this session reached the build step should have been
      # caught here instead.
      #
      # It cannot simply be made blocking: the project has ~330 pre-existing
      # info-level lints, and plain `flutter analyze` exits non-zero on
      # infos too, so that would fail every push over pre-existing noise.
      # --no-fatal-infos/--no-fatal-warnings fail the build on errors only,
      # which is the part that actually breaks compilation.
      - name: Analyze (errors block the build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Phase 3 safety net: run the app test suite on every push/PR so a
      # broken connection is caught in CI, not on the live dashboard. The
      # connectivity checks live in connectivity-ci.yml (they need live
      # Supabase secrets); this step runs the local unit/widget tests.
      - name: Run tests
        run: flutter test

      # The repo's own static + migration harness (tools/harness/run_all.sh):
      # 64 gates over the Dart, the SQL and the migrations a deploy would
      # actually apply. It is the only thing here that reads the SQL *inside*
      # plpgsql bodies, which `supabase db push` accepts until execution time.
      #
      # It had never been wired into CI, and that is exactly why the hole it
      # now closes stayed open: the release pass found two pending migrations
      # (016, 017) that the plpgsql gate had been silently skipping, because
      # its body classifier tested `LANGUAGE plpgsql` case-sensitively while
      # every sibling predicate in the file was case-insensitive, and every
      # migration here writes it in lower case. A gate nobody runs is not a
      # gate.
      #
      # pglast is what lets the plpgsql gate parse. Without it the gate reports
      # a skip rather than a pass, so a wheel that cannot be installed degrades
      # the check instead of failing the release over a PyPI hiccup.
      - name: Static + migration harness
        run: |
          pip install --quiet pglast || echo "::warning::pglast unavailable; the plpgsql body gate will skip"
          sh tools/harness/run_all.sh

      - name: Commit pubspec.lock if changed
        if: github.event_name == 'push'
        run: |
          if [ -z "$(git status --porcelain pubspec.lock)" ]; then
            echo "pubspec.lock unchanged — skipping commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pubspec.lock
            git commit -m "ci: auto-generate pubspec.lock"
            git push
          fi

      # Stamp the app version into the artifact names below.
      #
      # Every build used to upload as plain `release-aab`, so 1.4.0+89,
      # 1.4.0+90, 1.5.1+101, 1.6.1+103 and 1.6.2+104 all sat in the Actions
      # list under one identical name. Picking the wrong one is easy and
      # silent, and it produced a real report — "I got the aab but my updates
      # are not there" — for a fix that was in the newest bundle all along.
      # The version is the only thing that tells the bundles apart, so it
      # belongs in the filename.
      - name: Stamp app version
        id: app_version
        run: |
          version=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          if [ -z "$version" ]; then
            echo "::error::No version found in pubspec.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "This build is $version"

      # === DEBUG APK BUILD — TEMPORARILY REMOVED (Actions minutes) ===
      #
      # This job used to build a debug APK and then a release appbundle: two
      # whole Gradle builds of the same project per push, ~20+ minutes of
      # metered runner time, for one artifact anyone actually needs. The debug
      # APK is already produced on demand by the dedicated "Build Debug APK"
      # workflow (workflow_dispatch, with its own Release-asset fallback), so
      # nothing here is the only copy of anything.
      #
      # Removed for this run because Actions minutes are above 90%: only the
      # release .aab is built below. RESTORE by re-adding the two steps that
      # were here (`Build debug APK`, `Upload debug APK artifact` — the upload
      # was `continue-on-error: true`, `actions/upload-artifact@v4`, name
      # `debug-apk-${{ steps.app_version.outputs.version }}`) once the minutes
      # meter is healthy again.

      # The `flutter clean` + `pub get` that used to sit here existed for one
      # reason: two Gradle builds of the same project on one runner, whose
      # combined outputs ran it out of disk mid-R8. With the debug build gone
      # this job does a single build, so there is nothing to free and roughly
      # two minutes not to spend. ~/.gradle and ~/.pub-cache are still warm from
      # `pub get` above.

      # === Release Bundle Build ===
      # Keystore is stored base64-encoded in the KEYSTORE_BASE64 Actions secret
      # and decoded at build time (never committed to the repo). See docs/SIGNING.md.
      # PKCS12: the key password equals the store password.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::One or more signing secrets are missing/empty. Required: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS (see docs/SIGNING.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-keystore.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release-keystore.p12" >> "$GITHUB_ENV"

      - name: Build release app bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} \
            --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Upload release AAB artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-aab-${{ steps.app_version.outputs.version }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

