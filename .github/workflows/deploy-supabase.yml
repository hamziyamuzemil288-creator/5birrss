# Manual Supabase deploy — runs ONLY when dispatched, never on push.
# All live-project credentials come from GitHub secrets; none are echoed.
# Secrets required (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — supabase CLI auth (Management API)
#   SUPABASE_DB_PASSWORD   — used by `supabase db push`
#   INDEXER_KEY            — set as a Supabase function secret (never printed)
# Project ref is not a secret — it is public in every Supabase URL.

name: Deploy Supabase

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (list pending migrations only, no changes applied)'
        type: boolean
        required: false
        default: true
      baseline_history:
        description: 'Mark pre-20260919 migrations as applied in history (never executes them)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: xnwieehlrhrffoikpglj
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  INDEXER_KEY: ${{ secrets.INDEXER_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # Fail early and explicitly before any Supabase CLI command. GitHub
      # maps a missing secret to an EMPTY string, so [ -z ] is the reliable
      # check — not shell `unset`. This is the message you saw: the CLI wants
      # SUPABASE_ACCESS_TOKEN long before it cares about anything else.
      - name: Verify required secrets are present
        run: |
          set -eu
          missing=0
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD INDEXER_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is missing or empty. Add it in Settings → Secrets and variables → Actions."
              missing=1
            fi
          done
          exit $missing

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # WHY STAGING IS ALWAYS RUN: the CLI identifies migrations by the
      # numeric prefix ONLY. `supabase_migrations.schema_migrations` has
      # `version text PRIMARY KEY` (verified in cli v2.117.0 source,
      # pkg/migration/history.go), and db push matches local files against
      # remote history by version (pkg/migration/apply.go,
      # FindPendingMigrations). This repo has two files sharing each of the
      # versions 0020/0021/0022/0024, so only one of each pair can ever be
      # recorded; the sibling stays "unapplied but older than the newest
      # remote migration" and fails the push with "Found local migration
      # files to be inserted before the last migration on remote database"
      # (run #4). We never rename or edit applied migrations, so instead the
      # workflow stages a copy of the migrations dir with ONE file per
      # version (alphabetically first, deterministic) and runs all CLI
      # commands against that copy. The duplicates' effects already exist in
      # the live DB (pasted via SQL editor); hiding them from the CLI is a
      # no-op there. For a FRESH/empty database this staging must be removed
      # so every file applies.
      - name: Stage migrations (one file per version)
        run: |
          set -eu
          stage="$(mktemp -d)"
          seen="$(mktemp)"
          count=0
          for f in supabase/migrations/*.sql; do
            base="$(basename "$f")"
            v="${base%%_*}"
            case "$v" in
              ''|*[!0-9]*)
                echo "skip (CLI-ignored, non-numeric prefix): $base"
                continue ;;
            esac
            if grep -qx "$v" "$seen"; then
              echo "skip (duplicate version $v, sibling already staged): $base"
              continue
            fi
            echo "$v" >> "$seen"
            cp "$f" "$stage/"
            count=$((count+1))
          done
          rm -f "$seen"
          rm -rf supabase/migrations
          mv "$stage" supabase/migrations
          echo "Staged $count migration files (one per version, no duplicates)"

      # The live DB was built by pasting SQL in the Supabase editor, so the
      # CLI migration-history table has no record of 0001-0033 and a plain
      # `db push` would replay them from scratch (run #2: "type \"app_role\"
      # already exists" in 0001). `migration repair --status applied` writes
      # ONLY the history table (UPSERT ... ON CONFLICT (version)) — it never
      # executes the files — so it is safe to re-run.
      #
      # CAUTION — the version range below is NOT 0001..0033 as an earlier
      # comment claimed. The loop marks EVERY staged file whose numeric
      # version is < 20260919000000, which now includes 0034..0041 (added
      # after that comment was written). Those 8 migrations would be
      # recorded as applied WITHOUT ever executing. Their effects are
      # already in the live DB (pasted via SQL editor), so this is correct
      # in practice — but it means baseline_history=true will never run
      # 0034..0041. Do not enable it against a fresh/empty database.
      # 20260919* files are NEVER marked applied by this step. The following
      # dry run is the gate.
      #
      # READING THE DRY RUN (this expectation changed as the repo grew — an
      # earlier version of this comment claimed "exactly the three 20260919*
      # files"; that was true when written and is now stale, ignore it):
      #   - The repo ships 95 migration files, but the staging step above
      #     reduces them to 87 (one per unique numeric version).
      #   - 0022a-0022d are dropped entirely: the CLI matches on the numeric
      #     prefix only, so a letter-suffixed file is never seen. Their effects
      #     are already in the live DB.
      #   - The four duplicate-version siblings (0020/0021/0022/0024) are
      #     dropped; only the alphabetically-first file of each is staged.
      #   - Every 2026*-prefixed file is a real, separately-applied migration
      #     and WILL appear as pending until it is recorded in the live
      #     schema_migrations table.
      # The exact pending list depends on what the live DB already has
      # recorded, which this workflow cannot report on its own. What you CAN
      # assert after a dry run: no staged file is silently dropped, and the
      # count never exceeds 87. A much longer list than three is expected
      # and is NOT a failure.
      - name: Baseline migration history (repair, no execution)
        if: ${{ inputs.baseline_history }}
        run: |
          set -eu
          versions=""
          for f in supabase/migrations/*.sql; do
            base="$(basename "$f")"
            v="${base%%_*}"
            case "$v" in
              ''|*[!0-9]*)
                echo "::warning::CLI ignores migration file with non-numeric prefix: $base"
                continue ;;
            esac
            if [ $((10#$v)) -lt 20260919000000 ]; then
              versions="$versions $v"
            else
              echo "kept pending: $base"
            fi
          done
          for v in $(printf '%s\n' $versions | sort -u); do
            echo "Marking $v applied (no execution)"
            supabase migration repair --status applied "$v"
          done

      - name: Dry run (db push --dry-run)
        if: ${{ inputs.dry_run }}
        run: supabase db push --dry-run

      - name: Apply migrations (db push)
        if: ${{ !inputs.dry_run }}
        # --include-all: 0034 is newer than the CLI-recorded remote history
        # baseline but predates the newest remote migration; without the flag
        # db push refuses with "Found local migration files to be inserted
        # before the last migration on remote database".
        run: supabase db push --include-all

      - name: Deploy function repo-chat
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy repo-chat

      - name: Deploy function index-chunks (no JWT verification)
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy index-chunks --no-verify-jwt

      # Provider approval — wired to the admin Provider Management screen
      # (Approve / Correction / Reject buttons).
      - name: Deploy function provider-approval
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy provider-approval

      # Wallet functions. admin-wallet-recharge is wired to the admin UI
      # (payment verification approve/reject); the other two are deployed
      # ahead of need so the subscription scheduler only has to be enabled.
      - name: Deploy function admin-wallet-recharge
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy admin-wallet-recharge

      - name: Deploy function wallet-deduct-fee
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy wallet-deduct-fee

      - name: Deploy function subscription-process
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy subscription-process

      # Order + ride flow functions. order-create is the server-authoritative
      # checkout endpoint (validates fractional unit-priced quantities); the
      # transition/claim functions drive the ride state machine. These were
      # missing from this workflow since it was written, so merged changes to
      # them never reached the live project without a manual deploy.
      - name: Deploy function order-create
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy order-create

      - name: Deploy function order-transition
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy order-transition

      - name: Deploy function ride-claim
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy ride-claim

      - name: Deploy function ride-transition
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy ride-transition

      # Document QR verification agent (Task 4) — signup ID auto-approval.
      - name: Deploy function document-verify
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy document-verify

      # Administrator image takedown. The row and the audit record go through
      # admin_moderate_image (called here with the caller's own JWT), but the
      # FILE cannot: Supabase refuses a direct DELETE on storage.objects for
      # every role, and the image buckets' delete policies are owner-scoped, so
      # an admin cannot remove another account's object from the client.
      # This function holds the service-role key and removes the object through
      # the Storage API — the only path Supabase allows. JWT verification stays
      # ON; it re-checks is_admin() server-side from the caller's own JWT.
      - name: Deploy function admin-image-delete
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy admin-image-delete

      # Permanent user removal from the admin Staff Assignment screen
      # (admin_staff_assignment_screen.dart invokes 'user-admin' with
      # action=delete_user). Added in f5d4574 alongside document-verify but
      # never added to this workflow, so the admin delete-user button has
      # been calling a function that was never deployed. It verifies the
      # caller holds the true ADMIN role server-side, so JWT verification
      # must stay ON (contrast staff-login / index-chunks, which are
      # unauthenticated entry points and take --no-verify-jwt).
      - name: Deploy function user-admin (true-ADMIN account deletion)
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy user-admin

      # Email OTP delivery for signup (Task 7). Stub mode until an email
      # provider is wired (see the function header for the TODO).
      - name: Deploy function send-otp
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy send-otp

      - name: Deploy function staff-create-gateway
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy staff-create-gateway

      # Permanent staff removal. Deployed here because the client cannot
      # delete an auth.users row without the service role key.
      - name: Deploy function staff-delete-gateway
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy staff-delete-gateway

      - name: Deploy function staff-change-password
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy staff-change-password

      - name: Deploy function staff-login (no JWT verification)
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy staff-login --no-verify-jwt

      # Task 13 item 2: server-side login gate — CAPTCHA enforcement +
      # per-account failure lockout before the password credential check.
      #
      # --no-verify-jwt is REQUIRED, not a convenience. The gate runs BEFORE
      # the credential check (its own header says so: "the gate must run
      # BEFORE the credential check is even attempted"), which means the
      # caller is signed out and has no user JWT. With the default
      # verify_jwt=true the gateway rejects the request with a bare 401
      # before the function body executes, so the gate never runs at all and
      # every login in the app fails. This is the same class of bug 5.6
      # records for account-change-password / account-deletion-gateway: a
      # function that is present, called from Flutter, and not actually
      # usable.
      #
      # It is safe to expose unauthenticated: the function holds the service
      # role, returns only a lockout verdict and a CAPTCHA demand, and every
      # refusal is indistinguishable on the wire, so it is not a username
      # oracle. That reasoning is the function header's, not a new claim.
      - name: Deploy function login-gate (no JWT verification)
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy login-gate --no-verify-jwt

      # Self-service password change for a signed-in USER or provider
      # (change_password_screen). It is a separate function from
      # staff-change-password on purpose — that one refuses anyone without a
      # staff row, and loosening it to "anyone signed in" would widen the
      # most privileged endpoint in the product. Both take the caller's own
      # JWT, so verification stays ON.
      #
      # Both functions below were in supabase/functions/ and called from
      # Flutter, but absent from this workflow, so "Change password" and
      # "approve account deletion" were calling functions that were never
      # deployed. Same class of bug as user-admin below.
      - name: Deploy function account-change-password
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy account-change-password

      # Approving an account-deletion request actually removes the login,
      # which needs the service role key. Called by the admin queue with the
      # deciding staff member's JWT; permission is re-checked server-side.
      - name: Deploy function account-deletion-gateway
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy account-deletion-gateway

      # Staff actioning a password reset for somebody who cannot sign in.
      # Same reason as account-deletion-gateway: writing to auth.users needs
      # the service role key, which must never reach a client, and there is no
      # SQL function that can do it.
      #
      # It is NOT deployed with --no-verify-jwt. The gateway re-checks the
      # caller's staff permission itself before touching anything, and it
      # identifies the caller from the caller's own JWT, so a signed-out request
      # has to be rejected by the function rather than waved through by the
      # gateway. Callers are the admin appeals queue, which is signed in.
      - name: Deploy function password-reset-gateway
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy password-reset-gateway

      - name: Set Supabase function secrets
        if: ${{ !inputs.dry_run }}
        run: |
          set -eu
          supabase secrets set INDEXER_KEY="$INDEXER_KEY"
          supabase secrets set LLM_PROVIDER=none

      # Fail loudly: every step fails the job on non-zero exit (`set -e` is
      # default in GH Actions run steps). The "Verify required secrets" step
      # aborts the run before anything touches the live project when any
      # secret is missing or empty, and the `set -eu` on the secrets step is
      # a second guard against an emptied INDEXER_KEY.
